name: Snorecard
options:
  bundleIdPrefix: com.vmstan
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  schemePathPrefix: ""

schemes:
  Snorecard:
    build:
      targets:
        Snorecard: all

packages:
  SnorecardKit:
    path: .

targets:
  Snorecard:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Snorecard
    dependencies:
      - package: SnorecardKit
        product: SnorecardKit
    info:
      path: Snorecard/Info.plist
      properties:
        CFBundleDisplayName: Snorecard
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.medical
        NSHumanReadableCopyright: "© 2026"
        # iOS-only — ignored on macOS but harmless to ship in the
        # shared plist.
        NSHealthShareUsageDescription: "Snorecard reads Apple Watch sleep stages and your height and weight from Apple Health so it can show them alongside your CPAP data and personalize your profile. Snorecard never writes anything to Health."
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUbiquitousContainers:
          iCloud.com.vmstan.Snorecard:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Snorecard
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vmstan.Snorecard
        PRODUCT_NAME: Snorecard
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CVZLL7XC62
        DEAD_CODE_STRIPPING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Snorecard
        # iOS-only alternate icons. Listing them unconditionally is
        # harmless on macOS — the asset catalog only contains the
        # alternates inside iOS-tagged variants, so the macOS build
        # ignores the setting.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES:
          - Snorecard-Callan
          - Snorecard-Charlie
          - Snorecard-Claude
          - Snorecard-Inverted
          - Snorecard-Joey
          - Snorecard-Oscar
          - Snorecard-Royale
        # Per-SDK entitlements: macOS needs App Sandbox + Hardened
        # Runtime; iOS needs HealthKit. Both share the iCloud
        # container and Foundation Models mach-lookup exception via
        # their respective .entitlements files.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Snorecard/Snorecard.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Snorecard/Snorecard-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Snorecard/Snorecard-iOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
